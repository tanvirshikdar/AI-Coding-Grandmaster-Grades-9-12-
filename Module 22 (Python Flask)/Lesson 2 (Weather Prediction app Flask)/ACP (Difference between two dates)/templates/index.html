<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Difference Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>Date Difference Calculator</h1>

    <form action="/calculate" method="POST">
        <h3>First Date</h3>
        <input type="number" name="dt1" placeholder="Day (DD)" required min="1" max="31">
        <input type="number" name="m1" placeholder="Month (MM)" required min="1" max="12">
        <input type="number" name="year1" placeholder="Year (YYYY)" required>

        <h3>Second Date</h3>
        <input type="number" name="dt2" placeholder="Day (DD)" required min="1" max="31">
        <input type="number" name="m2" placeholder="Month (MM)" required min="1" max="12">
        <input type="number" name="year2" placeholder="Year (YYYY)" required>

        <br><br>
        <button type="submit">Calculate Difference</button>
    </form>

    {% if difference is not none %}
    <h2 style="color: #2c3e50;">The difference is: {{ difference }} days</h2>
    {% endif %}

    {% if error %}
    <h2 style="color: red;">{{ error }}</h2>
    {% endif %}
</body>

</html>
